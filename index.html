<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paolo Agostinetto - Co-founder at Redokun</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Press Start 2P for 8-bit style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body class="overflow-hidden">
    <!-- Space Background -->
    <div id="space-bg" class="fixed inset-0 -z-10"></div>

    <!-- Stars Layer -->
    <div id="stars" class="fixed inset-0 -z-10"></div>

    <!-- Shooting Stars -->
    <div id="shooting-stars" class="fixed inset-0 -z-10"></div>

    <!-- Planets -->
    <div id="planet-1" class="planet"></div>
    <div id="planet-2" class="planet"></div>
    <div id="spaceship" class="spaceship"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="content-container max-w-3xl w-full">
            <!-- Header -->
            <div class="text-center mb-8 glitch-container">
                <h1 class="pixel-text text-4xl md:text-6xl mb-4 text-cyan-400 glow-text">
                    PAOLO AGOSTINETTO
                </h1>
                <div class="scanline"></div>
            </div>

            <!-- Main Info Card -->
            <div class="pixel-card bg-black bg-opacity-80 border-4 border-cyan-400 p-8 mb-6 glow-border">
                <div class="mb-6">
                    <p class="text-xl md:text-2xl text-green-400 pixel-text mb-4">
                        &gt; CO-FOUNDER @ REDOKUN
                    </p>
                </div>

                <div class="space-mono-text text-gray-300 text-base md:text-lg leading-relaxed">
                    <p class="mb-4">
                        Building innovative solutions for translation and localization.
                    </p>
                    <p class="text-purple-400">
                        Navigating the intersection of technology and business.
                    </p>
                </div>
            </div>

            <!-- Links Section -->
            <div class="pixel-card bg-black bg-opacity-80 border-4 border-purple-500 p-6 glow-border-purple">
                <p class="pixel-text text-purple-400 mb-4 text-sm">&gt; CONNECT</p>
                <div class="flex flex-wrap gap-4 justify-center">
                    <a href="https://github.com/agopaul" target="_blank" class="pixel-button">
                        GITHUB
                    </a>
                    <a href="https://www.linkedin.com/in/paoloagostinetto/" target="_blank" class="pixel-button">
                        LINKEDIN
                    </a>
                    <a href="https://medium.com/@paoloagostinetto" target="_blank" class="pixel-button">
                        MEDIUM
                    </a>
                    <a href="http://stackoverflow.com/users/391397/paul-ago" target="_blank" class="pixel-button">
                        STACK OVERFLOW
                    </a>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-8">
                <p class="text-gray-500 text-sm space-mono-text">
                    paoloagostinetto@gmail.com
                </p>
            </div>
        </div>
    </div>

    <script>
        // Generate random stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numberOfStars = 200;

            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                starsContainer.appendChild(star);
            }
        }

        // Generate shooting stars
        function createShootingStars() {
            const container = document.getElementById('shooting-stars');

            setInterval(() => {
                if (Math.random() > 0.7) {
                    const shootingStar = document.createElement('div');
                    shootingStar.className = 'shooting-star';
                    shootingStar.style.left = Math.random() * 100 + '%';
                    shootingStar.style.top = Math.random() * 50 + '%';
                    container.appendChild(shootingStar);

                    setTimeout(() => {
                        shootingStar.remove();
                    }, 2000);
                }
            }, 2000);
        }

        // Initialize
        createStars();
        createShootingStars();

        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;

            document.getElementById('planet-1').style.transform =
                `translate(${moveX}px, ${moveY}px)`;
            document.getElementById('planet-2').style.transform =
                `translate(${moveX * -1.5}px, ${moveY * -1.5}px)`;
        });
    </script>
</body>
</html>
